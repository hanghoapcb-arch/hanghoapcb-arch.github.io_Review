<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phòng thí nghiệm Hóa học ảo</title>
<style>
:root{--c10:#0ea5e9;--c11:#10b981;--c12:#f97316}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;color:#0f172a;
background:linear-gradient(135deg,#e0f2fe,#f0fdf4 50%,#fff7ed);min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg svg{position:absolute;opacity:.13;animation:float 14s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-28px) rotate(8deg)}}
.bub{position:absolute;bottom:-40px;border-radius:50%;border:2px solid #38bdf8;opacity:.25;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh)}}
header,main,footer{position:relative;z-index:1;max-width:1150px;margin:auto;padding:0 18px}
header{text-align:center;padding-top:34px}
h1{margin:0;font-size:clamp(26px,4vw,40px)}
h1 span{background:linear-gradient(90deg,var(--c10),var(--c11),var(--c12));-webkit-background-clip:text;color:transparent}
header p{color:#475569;margin:8px 0 18px}
.tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:20px}
.tab{border:0;padding:10px 18px;border-radius:99px;background:#fff;font-weight:600;cursor:pointer;
box-shadow:0 2px 8px #0001;transition:.2s}
.tab.on{color:#fff;background:#334155}
.tab[data-g="10"].on{background:var(--c10)}.tab[data-g="11"].on{background:var(--c11)}.tab[data-g="12"].on{background:var(--c12)}
#q{padding:10px 16px;border-radius:99px;border:1px solid #cbd5e1;min-width:240px;font-size:15px}
.grade{margin:26px 0 10px;font-size:22px;display:flex;align-items:center;gap:10px}
.grade i{font-style:normal;font-size:14px;background:#fff;padding:2px 12px;border-radius:99px;box-shadow:0 1px 4px #0002}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:#fffd;backdrop-filter:blur(6px);border-radius:16px;padding:18px;cursor:pointer;
border-top:5px solid var(--k);box-shadow:0 4px 14px #0001;transition:.25s}
.card:hover{transform:translateY(-6px);box-shadow:0 12px 26px #0002}
.tag{font-size:12px;font-weight:700;color:var(--k)}
.card h3{margin:6px 0;font-size:17px}
.card p{margin:0;color:#64748b;font-size:14px}
.go{margin-top:12px;display:inline-block;font-size:13px;font-weight:600;color:var(--k)}
#modal{position:fixed;inset:0;background:#0009;z-index:10;display:none;align-items:center;justify-content:center;padding:14px}
#modal.show{display:flex}
.box{background:#fff;border-radius:14px;width:min(1100px,100%);height:90vh;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;gap:10px;align-items:center;padding:10px 14px;background:#f1f5f9}
.bar b{flex:1;font-size:15px}
.bar a,.bar button{border:0;background:#334155;color:#fff;padding:7px 12px;border-radius:8px;text-decoration:none;cursor:pointer;font-size:13px}
.bar button{background:#dc2626}
iframe{flex:1;border:0;width:100%}
footer{text-align:center;color:#64748b;padding:30px 18px;font-size:13px}
.empty{color:#64748b;padding:20px}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<header>
  <h1>🧪 <span>ChemLab 4.0 – Phòng thí nghiệm Hóa học số</span></h1>
  <p>18 bài thí nghiệm mô phỏng • Hóa học 10 – 11 – 12</p>
  <div class="tools">
    <button class="tab on" data-g="all">Tất cả (18)</button>
    <button class="tab" data-g="10">Khối 10</button>
    <button class="tab" data-g="11">Khối 11</button>
    <button class="tab" data-g="12">Khối 12</button>
    <input id="q" placeholder="🔍 Tìm bài thí nghiệm...">
  </div>
</header>
<main id="main"></main>
<footer>© Phòng thí nghiệm ảo Hóa học – hanghoapcb-arch</footer>

<div id="modal"><div class="box">
  <div class="bar"><b id="mt"></b><a id="mo" target="_blank">Mở tab mới ↗</a><button id="mc">✕ Đóng</button></div>
  <iframe id="fr" allowfullscreen></iframe>
</div></div>

<script>
const USER="hanghoapcb-arch";
const BASE=`https://${USER}.github.io/`;
// g: khối, ch: chương, t: tên bài, r: tên repo
const LABS=[
 // ===== KHỐI 10 =====
 {g:10,ch:"Chương 3",t:"Bài 11: Liên kết ion – Lắp ráp mô hình NaCl",r:"HH10_Bai_11_Lien_ket_ion_Lap_rap_mo_hinh_NaCl"},
 {g:10,ch:"Chương 3",t:"Bài 12: Liên kết cộng hóa trị",r:"HH10_Bai_12_Lien_ket_cong_hoa_tri"},
 {g:10,ch:"Chương 6",t:"Bài 19: Tốc độ phản ứng",r:"HH10_Bai_19_toc_do_phan_ung"},
 {g:10,ch:"Chương 7",t:"Bài 22: HCl tác dụng kim loại và NaHCO₃",r:"HH10_Bai_22_HCl_tac_dung_kim_loai_va_NaHCO3"},
 {g:10,ch:"Chương 7",t:"Bài 22: Nhận biết ion halide bằng AgNO₃",r:"HH10_Bai_22_Nhan_biet-_ion_halide_AgNO3"},
 // ===== KHỐI 11 =====
 {g:11,ch:"Chương 1",t:"Bài 2: Chuẩn độ acid – base (3D)",r:"HH11_Bai-2_chuan_do_acid_base_3d"},
 {g:11,ch:"Chương 3",t:"Bài 11: Tách β-carotene – tách biệt & tinh chế hợp chất hữu cơ (3D)",r:"HH11_Bai-11_tach_beta_carotene_3d"},
 // ===== KHỐI 12 =====
 {g:12,ch:"Chương 1",t:"Bài 1: Điều chế ester",r:"HH12_Bai_1_Dieu_che_Ester"},
 {g:12,ch:"Chương 1",t:"Bài 2: Phản ứng xà phòng hóa (3D)",r:"HH12_Bai_2_Phan_ung_xa_phong_hoa_3D"},
 {g:12,ch:"Chương 2",t:"Bài 4: Glucose tác dụng Cu(OH)₂",r:"HH12_Bai_4_Glucose_tac_dung_Cu-OH-2"},
 {g:12,ch:"Chương 3",t:"Bài 8: Tính chất của amine",r:"HH12_Bai_8_Tinh_chat_amine"},
 {g:12,ch:"Chương 4",t:"Bài 10: Phản ứng màu biuret",r:"HH12_Bai_10_Phan_ung_mau_biure"},
 {g:12,ch:"Chương 5",t:"Bài 15: Mô phỏng pin Galvani",r:"HH12_Bai_15_Mo_phong_pin_Gavani"},
 {g:12,ch:"Chương 5",t:"Bài 16: Ứng dụng của điện phân",r:"HH12_Bai_16_Ung_dung_dien_phan"},
 {g:12,ch:"Chương 5",t:"Bài 16: Điện phân dung dịch CuSO₄ và NaCl",r:"HH12_Bai_16_-ien_phan_ddCuSO4_NaCl"},
 {g:12,ch:"Chương 6",t:"Bài 19: Tính chất vật lý và hóa học của kim loại",r:"HH12_Bai_19_Tinh_chat_kim_loai"},
 {g:12,ch:"Chương 6",t:"Bài 22: Sự ăn mòn kim loại – ăn mòn điện hóa",r:"HH12_Bai_22_An_mon_dien_hoa"},
 {g:12,ch:"Chương 7",t:"Bài 24: Nguyên tố nhóm IA",r:"HH12_Bai_24_Nguyen_to_nhom_IA"}
];
const COLOR={10:"var(--c10)",11:"var(--c11)",12:"var(--c12)"};
let grade="all",kw="";
const $=s=>document.querySelector(s);

function render(){
  const main=$("#main");main.innerHTML="";
  [10,11,12].filter(g=>grade=="all"||grade==g).forEach(g=>{
    const list=LABS.filter(x=>x.g==g&&(x.t+x.ch).toLowerCase().includes(kw));
    if(!list.length)return;
    main.insertAdjacentHTML("beforeend",
     `<h2 class="grade" style="color:${COLOR[g]}">Khối ${g}<i>${list.length} bài</i></h2><div class="grid">`+
     list.map(x=>`<div class="card" style="--k:${COLOR[g]}" data-r="${x.r}" data-t="${x.t}">
       <div class="tag">HÓA HỌC ${g} • ${x.ch.toUpperCase()}</div>
       <h3>${x.t}</h3><p>Thí nghiệm mô phỏng tương tác</p><span class="go">▶ Vào phòng thí nghiệm</span></div>`).join("")+`</div>`);
  });
  if(!main.innerHTML)main.innerHTML='<p class="empty">Không tìm thấy bài phù hợp.</p>';
}
document.addEventListener("click",e=>{
  const t=e.target.closest(".tab");
  if(t){document.querySelectorAll(".tab").forEach(b=>b.classList.remove("on"));t.classList.add("on");grade=t.dataset.g;render();}
  const c=e.target.closest(".card");
  if(c){const url=BASE+c.dataset.r+"/";$("#mt").textContent=c.dataset.t;$("#fr").src=url;$("#mo").href=url;$("#modal").classList.add("show");}
});
function closeM(){$("#modal").classList.remove("show");$("#fr").src="about:blank"}
$("#mc").onclick=closeM;
$("#modal").onclick=e=>{if(e.target.id=="modal")closeM()};
document.onkeydown=e=>{if(e.key=="Escape")closeM()};
$("#q").oninput=e=>{kw=e.target.value.toLowerCase();render()};

// ===== Nền hình ảnh hóa học =====
const SV={
 flask:'<svg width="90" height="90" viewBox="0 0 64 64" fill="none" stroke="#0369a1" stroke-width="3"><path d="M26 6h12M28 6v18L10 54a4 4 0 0 0 3.5 6h37a4 4 0 0 0 3.5-6L36 24V6"/><path d="M17 44h30" /></svg>',
 benzene:'<svg width="90" height="90" viewBox="0 0 64 64" fill="none" stroke="#047857" stroke-width="3"><polygon points="32,6 55,19 55,45 32,58 9,45 9,19"/><circle cx="32" cy="32" r="12"/></svg>',
 mol:'<svg width="100" height="90" viewBox="0 0 80 64" stroke="#c2410c" stroke-width="3"><line x1="15" y1="48" x2="40" y2="20"/><line x1="40" y1="20" x2="66" y2="46"/><circle cx="15" cy="48" r="9" fill="#fdba74"/><circle cx="40" cy="20" r="11" fill="#fb923c"/><circle cx="66" cy="46" r="9" fill="#fdba74"/></svg>',
 tube:'<svg width="60" height="100" viewBox="0 0 40 70" fill="none" stroke="#7c3aed" stroke-width="3"><path d="M10 4v50a10 10 0 0 0 20 0V4M8 4h24"/><path d="M10 38h20" stroke="#a78bfa"/></svg>',
 atom:'<svg width="90" height="90" viewBox="0 0 64 64" fill="none" stroke="#be185d" stroke-width="2.5"><ellipse cx="32" cy="32" rx="26" ry="10"/><ellipse cx="32" cy="32" rx="26" ry="10" transform="rotate(60 32 32)"/><ellipse cx="32" cy="32" rx="26" ry="10" transform="rotate(120 32 32)"/><circle cx="32" cy="32" r="4" fill="#be185d"/></svg>'
};
const bg=$("#bg"),keys=Object.keys(SV);
for(let i=0;i<16;i++){
  const d=document.createElement("div");d.innerHTML=SV[keys[i%keys.length]];
  const s=d.firstChild;s.style.left=Math.random()*92+"%";s.style.top=Math.random()*88+"%";
  s.style.animationDelay=-Math.random()*12+"s";s.style.transform=`rotate(${Math.random()*40-20}deg)`;bg.appendChild(s);
}
for(let i=0;i<14;i++){
  const b=document.createElement("div");b.className="bub";const z=8+Math.random()*24;
  b.style.cssText+=`width:${z}px;height:${z}px;left:${Math.random()*100}%;animation-duration:${10+Math.random()*14}s;animation-delay:${-Math.random()*20}s`;
  bg.appendChild(b);
}
render();
</script>
</body>
</html>
